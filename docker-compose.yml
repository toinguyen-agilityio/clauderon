# Local Postgres for development and tests. Not used in production.
# Named so it never shares a project with deploy/compose.yml (clauderon-prod).
name: clauderon-dev
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: clauderon
      POSTGRES_PASSWORD: clauderon
      POSTGRES_DB: clauderon
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
