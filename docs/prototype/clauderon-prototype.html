<title>Clauderon Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: operator console. Fixed left rail for the six modules, dense work area on the right,
   state encoded as pills and stripes, monospace for anything that comes from git, GitHub or a Pod. */
:root{
  --bg:#f3f4f7; --panel:#ffffff; --sunk:#eceef3; --hover:#e6e9f0;
  --line:#dde1e9; --line-strong:#c6ccd8;
  --fg:#131722; --fg2:#4b5365; --fg3:#848c9e;
  --accent:#3344c4; --accent-2:#2735a6; --accent-weak:#e6e8fa; --on-accent:#ffffff;
  --run:#2160c4; --run-bg:#e1eafa;
  --wait:#9a5800; --wait-bg:#fbeed6;
  --ok:#14773f; --ok-bg:#dcf2e5;
  --fail:#c02828; --fail-bg:#fae2e2;
  --intr:#b0430c; --intr-bg:#fae5d8;
  --mute:#5d6474; --mute-bg:#e9ebf0;
  --t-issue:#6b7280; --t-plan:#7a3be0; --t-branch:#0b8487; --t-test:#a86d12; --t-pr:#14773f; --t-summary:#2160c4; --t-shot:#bb3384;
  --code-bg:#f7f8fb; --add-bg:#e3f5ea; --del-bg:#fbe8e8; --add-fg:#14692f; --del-fg:#a12424;
  --term-bg:#151924; --term-fg:#d5dae6; --term-dim:#7b8496; --term-acc:#9aa8ff; --term-ok:#6fd49a; --term-fail:#ff8a8a; --term-warn:#f2c46b;
  --shadow:0 1px 2px rgba(18,24,40,.06),0 6px 20px rgba(18,24,40,.07);
  --scrim:rgba(14,18,28,.42);
  --font-ui:'Instrument Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:8px; --r-sm:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1118; --panel:#151922; --sunk:#1b2029; --hover:#222834;
  --line:#272e3a; --line-strong:#353d4c;
  --fg:#e6e9f0; --fg2:#a4acbd; --fg3:#6d7689;
  --accent:#8d9bff; --accent-2:#a9b4ff; --accent-weak:#1f2550; --on-accent:#0e1118;
  --run:#7fa8f5; --run-bg:#172742;
  --wait:#f0b55a; --wait-bg:#3a2a10;
  --ok:#62cf8f; --ok-bg:#12301f;
  --fail:#ff7d7d; --fail-bg:#3d1717;
  --intr:#ff9a62; --intr-bg:#3b1f10;
  --mute:#9aa2b2; --mute-bg:#232935;
  --t-issue:#9aa2b2; --t-plan:#b590ff; --t-branch:#4fd0d2; --t-test:#e8b45a; --t-pr:#62cf8f; --t-summary:#7fa8f5; --t-shot:#f07cc0;
  --code-bg:#11151d; --add-bg:#12301f; --del-bg:#3a1818; --add-fg:#79dba1; --del-fg:#ff9b9b;
  --term-bg:#0a0d13; --term-fg:#d5dae6; --term-dim:#6b7488; --term-acc:#9aa8ff; --term-ok:#6fd49a; --term-fail:#ff8a8a; --term-warn:#f2c46b;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1118; --panel:#151922; --sunk:#1b2029; --hover:#222834;
  --line:#272e3a; --line-strong:#353d4c;
  --fg:#e6e9f0; --fg2:#a4acbd; --fg3:#6d7689;
  --accent:#8d9bff; --accent-2:#a9b4ff; --accent-weak:#1f2550; --on-accent:#0e1118;
  --run:#7fa8f5; --run-bg:#172742;
  --wait:#f0b55a; --wait-bg:#3a2a10;
  --ok:#62cf8f; --ok-bg:#12301f;
  --fail:#ff7d7d; --fail-bg:#3d1717;
  --intr:#ff9a62; --intr-bg:#3b1f10;
  --mute:#9aa2b2; --mute-bg:#232935;
  --t-issue:#9aa2b2; --t-plan:#b590ff; --t-branch:#4fd0d2; --t-test:#e8b45a; --t-pr:#62cf8f; --t-summary:#7fa8f5; --t-shot:#f07cc0;
  --code-bg:#11151d; --add-bg:#12301f; --del-bg:#3a1818; --add-fg:#79dba1; --del-fg:#ff9b9b;
  --term-bg:#0a0d13; --term-fg:#d5dae6; --term-dim:#6b7488; --term-acc:#9aa8ff; --term-ok:#6fd49a; --term-fail:#ff8a8a; --term-warn:#f2c46b;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.01em}
h1{font-size:22px}
h2{font-size:16px}
h3{font-size:14px}
p{margin:0}
.mono{font-family:var(--font-mono);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--fg2)}
.faint{color:var(--fg3)}
.small{font-size:12.5px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg3);font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.grow{flex:1;min-width:0}

/* shell */
.shell{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:20px;padding:18px 14px;border-right:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand-mark{width:28px;height:28px;border-radius:7px;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-family:var(--font-mono);font-weight:600;font-size:13px}
.brand-name{font-weight:700;font-size:15px;letter-spacing:-.01em}
.brand-sub{font-size:11px;color:var(--fg3)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);color:var(--fg2);font-weight:500}
.nav a:hover{background:var(--hover);text-decoration:none;color:var(--fg)}
.nav a.on{background:var(--accent-weak);color:var(--accent)}
.nav svg{width:16px;height:16px;flex:none}
.nav .badge{margin-left:auto}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--wait);color:var(--panel);font-size:11.5px;font-weight:700;display:inline-grid;place-items:center}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:10px 6px 0;border-top:1px solid var(--line)}
.me{display:flex;align-items:center;gap:10px}
.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;background:var(--sunk);color:var(--fg2);flex:none;text-transform:uppercase}
.main{min-width:0;padding-block:24px 96px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.view{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.page-head{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.page-head .sub{color:var(--fg2);margin-top:4px;max-width:70ch}
.crumbs{font-size:12.5px;color:var(--fg3);display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.crumbs a{color:var(--fg2)}

/* req ids */
.req{font-family:var(--font-mono);font-size:10.5px;color:var(--fg3);border:1px dashed var(--line-strong);border-radius:4px;padding:0 4px;white-space:nowrap}
.hide-ids .req{display:none}

/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:var(--r-sm);border:1px solid var(--line-strong);background:var(--panel);color:var(--fg);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-2)}
.btn.danger{color:var(--fail);border-color:color-mix(in srgb,var(--fail) 40%,var(--line))}
.btn.danger.solid{background:var(--fail);color:var(--panel);border-color:var(--fail)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--fg2)}
.btn.ghost:hover{background:var(--hover);color:var(--fg)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.btn svg{width:14px;height:14px}
.input,.select,.textarea{width:100%;height:34px;border:1px solid var(--line-strong);background:var(--panel);border-radius:var(--r-sm);padding:0 10px}
.textarea{height:auto;min-height:76px;padding:8px 10px;resize:vertical;line-height:1.45}
.input:focus,.select:focus,.textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label{font-weight:600;font-size:12.5px}
.field .hint{font-size:12px;color:var(--fg3)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r-sm);overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:0 12px;height:32px;font-weight:600;font-size:12.5px;color:var(--fg2);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent-weak);color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{height:28px;padding:0 10px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--fg2);font-size:12.5px;font-weight:500;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.fchip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-weak)}
.fchip .n{font-variant-numeric:tabular-nums;color:var(--fg3)}
.fchip.on .n{color:var(--accent)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--mute-bg);color:var(--mute)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.plain::before{display:none}
.pill.run{background:var(--run-bg);color:var(--run)}
.pill.wait{background:var(--wait-bg);color:var(--wait)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.fail{background:var(--fail-bg);color:var(--fail)}
.pill.intr{background:var(--intr-bg);color:var(--intr)}
.pill.queue{background:var(--mute-bg);color:var(--fg2)}
.pill.acc{background:var(--accent-weak);color:var(--accent)}
.pill.run::before{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.pill.run::before{animation:none}}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:4px;font-size:11.5px;font-weight:600;background:var(--sunk);color:var(--fg2);white-space:nowrap}
.tag.dry{background:var(--wait-bg);color:var(--wait);font-family:var(--font-mono);font-size:11px}
.tag.sample{background:var(--accent-weak);color:var(--accent)}
.label{display:inline-flex;align-items:center;height:19px;padding:0 7px;border-radius:10px;font-size:11.5px;border:1px solid var(--line);color:var(--fg2)}
.otype{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:4px;font-family:var(--font-mono);font-size:11px;background:var(--sunk);color:var(--fg)}
.otype i{width:7px;height:7px;border-radius:2px;background:var(--c,var(--fg3));flex:none}

/* surfaces */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.card-pad{padding:16px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.section-title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-wide{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
.page-head .mono{overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px}
.kv dt{color:var(--fg3)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.empty{padding:28px 16px;text-align:center;color:var(--fg2)}
.empty b{display:block;color:var(--fg);margin-bottom:4px}
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel)}
.banner.wait{background:var(--wait-bg);border-color:color-mix(in srgb,var(--wait) 30%,transparent)}
.banner.fail{background:var(--fail-bg);border-color:color-mix(in srgb,var(--fail) 30%,transparent)}
.banner.intr{background:var(--intr-bg);border-color:color-mix(in srgb,var(--intr) 30%,transparent)}
.banner.ok{background:var(--ok-bg);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.banner.info{background:var(--accent-weak);border-color:color-mix(in srgb,var(--accent) 25%,transparent)}
.banner .grow p+p{margin-top:4px}

/* tables */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11.5px;font-weight:600;color:var(--fg3);text-transform:uppercase;letter-spacing:.05em;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:color-mix(in srgb,var(--hover) 55%,transparent)}
.tbl tr.sel td{background:var(--accent-weak)}
.tbl .t-title{font-weight:500}
.tbl .t-title a{color:var(--fg)}
.cb{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}

/* selection bar */
.selbar{position:sticky;bottom:16px;z-index:5;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 12px 10px 16px;border-radius:var(--r);background:var(--fg);color:var(--bg);box-shadow:var(--shadow)}
.selbar .btn{border-color:transparent}
.selbar .btn.ghost{color:var(--bg)}
.selbar .btn.ghost:hover{background:color-mix(in srgb,var(--bg) 15%,transparent)}

/* meters */
.meter{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:3px}
.meter.hot i{background:var(--wait)}
.meter.crit i{background:var(--fail)}
.slots{display:flex;gap:4px}
.slot{width:22px;height:10px;border-radius:3px;background:var(--sunk);border:1px solid var(--line)}
.slot.run{background:var(--run);border-color:var(--run)}
.slot.wait{background:var(--wait);border-color:var(--wait)}

/* pods */
.pod-card{display:flex;flex-direction:column;gap:14px;padding:16px;border-left:3px solid var(--ok)}
.pod-card.off{border-left-color:var(--fail)}
.pod-card h3 a{color:var(--fg)}
.health{display:grid;grid-template-columns:44px 1fr 38px;gap:6px 10px;align-items:center;font-size:12px}

/* run page */
.run-grid{display:grid;grid-template-columns:minmax(260px,330px) minmax(0,1fr);gap:16px;align-items:start}
.nodes{display:flex;flex-direction:column}
.node-row{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;background:transparent;border-left:0;border-right:0;border-top:0;width:100%}
.node-row:last-child{border-bottom:0}
.node-row:hover{background:var(--hover)}
.node-row.on{background:var(--accent-weak)}
.node-row .nm{font-weight:600;font-size:13px}
.node-row .meta{font-size:12px;color:var(--fg3)}
.ndot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line-strong);background:var(--panel);color:var(--fg3)}
.ndot svg{width:12px;height:12px}
.ndot.succeeded{border-color:var(--ok);background:var(--ok);color:var(--panel)}
.ndot.running{border-color:var(--run);color:var(--run)}
.ndot.waiting{border-color:var(--wait);background:var(--wait-bg);color:var(--wait)}
.ndot.failed{border-color:var(--fail);background:var(--fail);color:var(--panel)}
.ndot.interrupted{border-color:var(--intr);background:var(--intr-bg);color:var(--intr)}
.ndot.cancelled{border-color:var(--mute);color:var(--mute)}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 12px;font-weight:600;color:var(--fg2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-size:13px}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
.tabs button .n{color:var(--fg3);font-weight:500;margin-left:4px}
.term{background:var(--term-bg);color:var(--term-fg);font-family:var(--font-mono);font-size:12px;line-height:1.6;border-radius:var(--r-sm);padding:12px 14px;max-height:340px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.term .d{color:var(--term-dim)}
.term .a{color:var(--term-acc)}
.term .k{color:var(--term-ok)}
.term .f{color:var(--term-fail)}
.term .w{color:var(--term-warn)}
.term .b{color:#fff;font-weight:600}
.term .cursor{display:inline-block;width:7px;height:13px;background:var(--term-fg);vertical-align:-2px;animation:pulse 1s steps(1) infinite}
.outv{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;background:var(--code-bg);font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
.att-tabs{display:flex;gap:6px;flex-wrap:wrap}
.att-tabs button{height:26px;padding:0 9px;border-radius:13px;border:1px solid var(--line);background:var(--panel);font-size:12px;font-weight:600;color:var(--fg2);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.att-tabs button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-weak)}
.att-tabs button.stale{text-decoration:line-through;text-decoration-color:var(--fg3)}
.human{border:1px solid color-mix(in srgb,var(--wait) 45%,var(--line));background:var(--wait-bg);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.qa{display:flex;flex-direction:column;gap:10px}
.qa .q,.qa .ans{padding:10px 12px;border-radius:var(--r-sm);max-width:62ch;font-size:13px}
.qa .q{background:var(--panel);border:1px solid var(--line)}
.qa .ans{background:var(--accent-weak);align-self:flex-end}
.qa .who{font-size:11px;color:var(--fg3);font-weight:600;margin-bottom:2px;display:block}
.diff{font-family:var(--font-mono);font-size:12px;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.diff-file{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;background:var(--sunk);border-bottom:1px solid var(--line);font-weight:600;flex-wrap:wrap}
.diff-body{overflow-x:auto;background:var(--code-bg)}
.diff-body div{white-space:pre;padding:0 12px;line-height:1.65;min-width:max-content}
.diff-body .ad{background:var(--add-bg);color:var(--add-fg)}
.diff-body .de{background:var(--del-bg);color:var(--del-fg)}
.diff-body .hk{color:var(--fg3);background:var(--sunk)}
.add{color:var(--ok)} .del{color:var(--fail)}
.shot{border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--panel)}
.shot svg{display:block;width:100%;height:auto}
.shot figcaption{font-family:var(--font-mono);font-size:11px;padding:6px 8px;border-top:1px solid var(--line);color:var(--fg2)}
.artifact{display:grid;gap:16px}
.artifact ol,.artifact ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.feed{display:flex;flex-direction:column}
.feed li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center}
.feed{list-style:none;margin:0;padding:0}

/* graph */
.minigraph{overflow-x:auto;padding:8px;background:var(--code-bg);border-bottom:1px solid var(--line)}
.minigraph svg{display:block;max-width:none}
.minigraph text{font-family:var(--font-ui);font-size:12px;font-weight:600}

/* flow editor */
.ed{display:grid;grid-template-columns:220px minmax(0,1fr) 280px;gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden;min-height:620px}
.ed-pal{border-right:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px;overflow:auto;max-height:720px}
.ed-insp{border-left:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:14px;overflow:auto;max-height:720px}
.pal-task{border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;background:var(--panel);cursor:grab;display:flex;flex-direction:column;gap:6px;text-align:left}
.pal-task:hover{border-color:var(--accent)}
.pal-task .nm{font-weight:600;font-size:12.5px;display:flex;gap:6px;align-items:center}
.cv-wrap{overflow:auto;background-color:var(--code-bg);background-image:radial-gradient(var(--line-strong) 1px,transparent 1px);background-size:20px 20px;position:relative;max-height:720px}
.cv{position:relative;width:1500px;height:820px}
.cv svg.edges{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.gnode{position:absolute;width:208px;background:var(--panel);border:1.5px solid var(--line-strong);border-radius:var(--r);box-shadow:var(--shadow);user-select:none}
.gnode.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak),var(--shadow)}
.gnode.err{border-color:var(--fail)}
.gnode .gh{height:40px;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--line);cursor:grab;font-weight:600;font-size:12.5px}
.gnode.ro .gh{cursor:default}
.gnode .gh .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.kind{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;flex:none;font-family:var(--font-mono);font-size:10px;font-weight:700}
.kind.agent{background:var(--accent-weak);color:var(--accent)}
.kind.command{background:var(--sunk);color:var(--fg)}
.kind.human{background:var(--wait-bg);color:var(--wait)}
.kind.entry{background:var(--fg);color:var(--bg)}
.gports{display:grid;grid-template-columns:1fr 1fr;padding:4px 0 6px}
.gports .col{display:flex;flex-direction:column}
.port{height:24px;display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:10.5px;color:var(--fg2);position:relative;white-space:nowrap}
.port.in{padding-left:12px}
.port.out{justify-content:flex-end;padding-right:12px}
.port .dot{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--panel);border:2px solid var(--c,var(--fg3));top:6px}
.port.in .dot{left:-7px}
.port.out .dot{right:-7px;cursor:crosshair}
.port.out .dot:hover{background:var(--c)}
.port.off{opacity:.4}
.port .opt{color:var(--fg3)}
.edge{fill:none;stroke-width:2}
.edge-hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}
.edge.sel{stroke-width:3.5}
.edge.bad{stroke:var(--fail)!important;stroke-dasharray:6 4}
.edge-err rect{fill:var(--fail)}
.edge-err text{fill:var(--panel);font-family:var(--font-ui);font-size:11px;font-weight:600}
.problems{display:flex;flex-direction:column;gap:6px}
.problem{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;padding:8px 10px;border-radius:var(--r-sm);background:var(--fail-bg);color:var(--fail);border:0;text-align:left;cursor:pointer;width:100%}
.flow-card{display:flex;flex-direction:column;gap:12px;padding:16px}
.flow-chain{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px;color:var(--fg2)}
.flow-chain span.n{padding:2px 7px;border-radius:4px;background:var(--sunk);color:var(--fg)}
.task-card{display:flex;flex-direction:column;gap:10px;padding:14px}
.io{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

.host{display:flex;flex-direction:column;gap:14px;padding-bottom:16px}
.host-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start;padding:16px 16px 0}
.host-meters{padding:0 16px;display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:16px;align-items:center}
.pod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;padding:0 16px}
.pod-tile{display:flex;flex-direction:column;gap:14px;padding:16px;border-radius:var(--r);background:var(--ok-bg);border:1.5px solid transparent;color:var(--fg);text-align:left;font:inherit;cursor:pointer;min-width:0}
.pod-tile:hover{text-decoration:none;border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.pod-tile.mine{border-color:var(--ok)}
.pod-tile.off{background:var(--sunk)}
.pod-tile.new{background:var(--panel);border:1.5px dashed var(--line-strong);align-items:center;justify-content:center;text-align:center;color:var(--fg2);min-height:220px}
@media (max-width:860px){.host-meters{grid-template-columns:minmax(0,1fr)}}
/* modal */
.modal-bg{position:fixed;inset:0;background:var(--scrim);z-index:40;display:grid;place-items:center;padding:16px;padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
.modal{width:min(640px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--panel);border-radius:12px;box-shadow:var(--shadow);border:1px solid var(--line);display:flex;flex-direction:column}
.modal.wide{width:min(860px,100%)}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.modal-b{padding:18px 20px;display:flex;flex-direction:column;gap:16px}
.modal-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;position:sticky;bottom:0;background:var(--panel)}
.pick{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-sm);max-height:240px;overflow:auto}
.pick label{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.pick label:last-child{border-bottom:0}
.pick label.dis{cursor:not-allowed;opacity:.6}
.opt-card{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;cursor:pointer}
.opt-card.on{border-color:var(--accent);background:var(--accent-weak)}
.opt-card.dis{opacity:.55;cursor:not-allowed}
.opt-card input{margin-top:3px;accent-color:var(--accent)}
.code-line{display:flex;gap:8px;align-items:center;background:var(--term-bg);color:var(--term-fg);font-family:var(--font-mono);font-size:12px;padding:10px 12px;border-radius:var(--r-sm);overflow-x:auto}
.code-line code{white-space:nowrap;flex:1}
.err-text{color:var(--fail);font-size:12.5px}

/* toasts & sim */
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(76px,calc(env(safe-area-inset-bottom,0px) + 76px));z-index:60;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:var(--r-sm);box-shadow:var(--shadow);font-size:13px;max-width:360px}
.sim-fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:30;display:flex;gap:8px;align-items:center;height:40px;padding:0 14px;border-radius:20px;border:1px dashed var(--wait);background:var(--wait-bg);color:var(--wait);font-weight:700;font-size:12.5px;cursor:pointer;box-shadow:var(--shadow)}
.sim{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(64px,calc(env(safe-area-inset-bottom,0px) + 64px));z-index:31;width:min(340px,calc(100vw - 32px));max-height:calc(100vh - 100px);overflow:auto;background:var(--panel);border:1px dashed var(--wait);border-radius:12px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:14px}
.sim h3{color:var(--wait)}
.sim-fab svg{width:14px;height:14px;flex:none}
.sim-fab{white-space:nowrap}
.tabs{overflow-y:hidden}
.proto-note{font-size:12px;color:var(--wait);background:var(--wait-bg);border-radius:var(--r-sm);padding:8px 10px}

/* sign in */
.signin{min-height:100%;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.signin-card{width:min(420px,100%);display:flex;flex-direction:column;gap:20px;padding:28px}
.signin-card .brand{padding:0}

/* responsive */
@media (max-width:1100px){
  .ed{grid-template-columns:200px minmax(0,1fr)}
  .ed-insp{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);max-height:none}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;z-index:20;height:auto;flex-direction:row;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .brand-sub,.brand-name{display:none}
  .nav{flex-direction:row}
  .nav a{padding:7px 9px;white-space:nowrap}
  .nav a span.lbl{display:none}
  .nav a.on span.lbl{display:inline}
  .side-foot{margin:0 0 0 auto;border:0;padding:0;flex-direction:row}
  .side-foot .me-text,.side-foot .theme-seg{display:none}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:18px}
  .run-grid,.g2,.g3,.g-wide{grid-template-columns:minmax(0,1fr)}
  .ed{grid-template-columns:minmax(0,1fr)}
  .ed-pal{border-right:0;border-bottom:1px solid var(--line);flex-direction:row;overflow-x:auto;max-height:none}
  .ed-pal .pal-task{min-width:170px}
  .ed-pal .eyebrow{display:none}
  .cv-wrap{max-height:520px}
}
</style>

<div id="app"></div>

<script>
(function(){
'use strict';
/* ---------------------------------------------------------------- utils */
const VER = 5, KEY = 'clauderon-proto-v' + VER;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now = () => Date.now();
const rand = (a,b) => a + Math.random()*(b-a);
const clone = o => JSON.parse(JSON.stringify(o));
const MIN = 60000;
function hash(s){let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function ago(t){ if(!t) return '—'; const d=Math.max(0,now()-t); if(d<45000) return 'just now'; if(d<3600000) return Math.round(d/60000)+' min ago'; if(d<86400000) return Math.round(d/3600000)+' h ago'; return Math.round(d/86400000)+' d ago'; }
function dur(ms){ if(ms==null||isNaN(ms)) return '—'; const s=Math.max(0,Math.round(ms/1000)); if(s<60) return s+'s'; const m=Math.floor(s/60); if(m<60) return m+'m '+String(s%60).padStart(2,'0')+'s'; return Math.floor(m/60)+'h '+(m%60)+'m'; }
function ktok(n){ if(!n) return '—'; return n>=1000 ? (n/1000).toFixed(1)+'k' : String(n); }
function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').split('-').slice(0,4).join('-'); }

const OTYPES = ['issue','plan','branch','test-result','pull-request','summary','screenshot'];
const OCOLOR = {issue:'--t-issue',plan:'--t-plan',branch:'--t-branch','test-result':'--t-test','pull-request':'--t-pr',summary:'--t-summary',screenshot:'--t-shot'};
const otype = t => `<span class="otype" style="--c:var(${OCOLOR[t]||'--fg3'})"><i></i>${esc(t)}</span>`;
const RUN_LABEL = {queued:'Queued',running:'Running',waiting:'Waiting for human',succeeded:'Succeeded',failed:'Failed',interrupted:'Interrupted',cancelled:'Cancelled'};
const RUN_CLS = {queued:'queue',running:'run',waiting:'wait',succeeded:'ok',failed:'fail',interrupted:'intr',cancelled:''};
const TS_LABEL = {open:'Open',queued:'Queued','in-run':'In run','needs-you':'Needs you',failed:'Failed',interrupted:'Interrupted','pr-open':'PR open','pr-merged':'PR merged',closed:'Closed'};
const TS_CLS = {open:'plain',queued:'queue','in-run':'run','needs-you':'wait',failed:'fail',interrupted:'intr','pr-open':'acc','pr-merged':'ok',closed:''};
const runPill = s => `<span class="pill ${RUN_CLS[s]||''}">${RUN_LABEL[s]||esc(s)}</span>`;
const req = (...ids) => ids.map(i=>`<span class="req">${i}</span>`).join(' ');
const KIND_MARK = {agent:'AI',command:'$_',human:'H',entry:'#'};
const kindBadge = k => `<span class="kind ${k}" title="${k}">${KIND_MARK[k]}</span>`;

const IC = {
  projects:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4.5h4l1.5 1.5H14v6.5H2z"/></svg>',
  tickets:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="5.5"/><circle cx="8" cy="8" r="1.5" fill="currentColor"/></svg>',
  runs:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3l8 5-8 5z"/><path d="M13 3v10"/></svg>',
  needs:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="5.5" r="2.5"/><path d="M3 14c.7-2.6 2.6-4 5-4s4.3 1.4 5 4"/></svg>',
  flows:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="2" width="5" height="4" rx="1"/><rect x="9.5" y="10" width="5" height="4" rx="1"/><path d="M6.5 4h3a2 2 0 012 2v4"/></svg>',
  pods:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2.5" width="12" height="4.5" rx="1"/><rect x="2" y="9" width="12" height="4.5" rx="1"/><path d="M4.5 4.75h.01M4.5 11.25h.01" stroke-width="2"/></svg>',
  check:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3.5 8.5l3 3 6-7"/></svg>',
  x:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 4l8 8M12 4l-8 8"/></svg>',
  spin:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" class="spin"><path d="M8 2a6 6 0 016 6"/></svg>',
  pause:'<svg viewBox="0 0 16 16" fill="currentColor"><rect x="4" y="3" width="3" height="10" rx="1"/><rect x="9" y="3" width="3" height="10" rx="1"/></svg>',
  bolt:'<svg viewBox="0 0 16 16" fill="currentColor"><path d="M9 1L3 9h4l-1 6 6-8H8z"/></svg>',
  plus:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3v10M3 8h10"/></svg>',
  sync:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M13 5.5A5.5 5.5 0 003 6M3 10.5a5.5 5.5 0 0010-.5"/><path d="M13 2.5v3h-3M3 13.5v-3h3"/></svg>',
  play:'<svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5l9 5.5-9 5.5z"/></svg>',
  retry:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 8a5 5 0 109-3"/><path d="M12 2v3H9"/></svg>',
  stop:'<svg viewBox="0 0 16 16" fill="currentColor"><rect x="3.5" y="3.5" width="9" height="9" rx="1.5"/></svg>',
  lock:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 015 0v2"/></svg>',
  copy:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="5" width="8.5" height="8.5" rx="1.5"/><path d="M3 10.5V3.5A1 1 0 014 2.5h6.5"/></svg>',
  warn:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 2l6.5 11.5h-13z"/><path d="M8 6.5v3M8 11.5h.01"/></svg>',
};

/* ---------------------------------------------------------------- state */
let S;          // persisted domain state
const U = {     // per-session UI state
  term:{}, sel: new Set(), tkProject:'p1', tkFilter:'all', tkSearch:'',
  runFilter:{state:'all',flow:'all',pod:'all',mode:'all'},
  runSel:{}, runTab:{}, attSel:{}, drafts:{}, modal:null, sim:false, ed:null, toasts:[], dirty:true,
};

function uid(p){ return p + '-' + (S.seq++); }
const byId = (arr,id) => arr.find(x=>x.id===id);
const projectById = id => byId(S.projects,id);
const ticketById = id => byId(S.tickets,id);
const podById = id => byId(S.pods,id);
const flowById = id => byId(S.flows,id);
const taskById = id => byId(S.tasks,id);
const runById = id => byId(S.runs,id);
const batchById = id => byId(S.batches,id);
const repoShort = p => p.repo.split('/')[1];
const tkKey = t => repoShort(projectById(t.projectId)) + '#' + t.number;
const isActive = r => ['queued','running','waiting','failed','interrupted'].includes(r.state);
const holdsSlot = r => r.state==='running' || r.state==='waiting';
const slotsUsed = podId => S.runs.filter(r=>r.podId===podId && holdsSlot(r)).length;
const podOf = m => S.pods.find(p=>p.owner===m);
const podUp = p => !!p && p.state==='running' && S.host.agent;
const podReady = p => podUp(p) && p.claude.ok && p.gh.ok;
const canStart = m => { const p=podOf(m); return !!p && p.claude.ok && p.gh.ok; };

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ const s = localStorage.getItem(KEY); if(s){ const o = JSON.parse(s); if(o && o.v===VER) return o; } }catch(e){} return null; }
function prefs(){ try{ return JSON.parse(localStorage.getItem('clauderon-proto-prefs')||'{}'); }catch(e){ return {}; } }
function setPref(k,v){ try{ const p=prefs(); p[k]=v; localStorage.setItem('clauderon-proto-prefs', JSON.stringify(p)); }catch(e){} }

/* ---------------------------------------------------------------- seed data */
function seedTasks(){
  return [
    {id:'t-ticket',name:'Ticket',kind:'entry',sample:true,flavor:'entry',instructions:'The Ticket the Run was started for. Every Flow has exactly one.',inputs:[],outputs:[{type:'issue'}]},
    {id:'t-grill',name:'Grill a plan',kind:'human',human:'grill',sample:true,flavor:'grill',instructions:'Ask the Member questions about the issue until the scope is clear, then write a short implementation plan.',inputs:[{type:'issue',req:true}],outputs:[{type:'plan'}]},
    {id:'t-draft',name:'Draft a plan',kind:'agent',sample:true,flavor:'plan',instructions:'Read the issue and the code it touches. Write a numbered plan: files to change, tests to add, risks.',inputs:[{type:'issue',req:true}],outputs:[{type:'plan'}]},
    {id:'t-approve-plan',name:'Approve a plan',kind:'human',human:'approve',sample:true,flavor:'approve',instructions:'A Member approves the plan, or rejects it with feedback.',inputs:[{type:'plan',req:true}],outputs:[{type:'plan'}]},
    {id:'t-code',name:'Code a change',kind:'agent',sample:true,flavor:'code',instructions:'Implement the issue (following the plan if given). Keep the change small, add or update tests, commit on the Run branch.',inputs:[{type:'issue',req:true},{type:'plan',req:false}],outputs:[{type:'branch'},{type:'summary',opt:true}]},
    {id:'t-test',name:'Run tests',kind:'command',sample:true,flavor:'test',command:'npm test -- --reporter=dot',inputs:[{type:'branch',req:true}],outputs:[{type:'test-result'}]},
    {id:'t-shots',name:'Capture screenshots',kind:'command',sample:true,flavor:'shots',command:'npx playwright test --project=screens',inputs:[{type:'branch',req:true}],outputs:[{type:'screenshot'}]},
    {id:'t-pr',name:'Open a pull request',kind:'command',sample:true,flavor:'pr',command:'git push -u origin HEAD && gh pr create --base "$BASE" --body-file .clauderon/pr.md',inputs:[{type:'branch',req:true},{type:'test-result',req:false},{type:'summary',req:false}],outputs:[{type:'pull-request'}]},
    {id:'t-approve-pr',name:'Approve the pull request',kind:'human',human:'approve',sample:true,flavor:'approve',instructions:'A Member reviews the diff and the pull request, then approves or rejects with feedback.',inputs:[{type:'pull-request',req:true}],outputs:[{type:'pull-request'}]},
    {id:'t-code-ledger',name:'Code a change (ledger rules)',kind:'agent',sample:false,flavor:'code',clonedFrom:'t-code',instructions:'Implement the issue following the plan. Money is integer minor units, never floats. Every new endpoint needs an idempotency test. Commit on the Run branch.',inputs:[{type:'issue',req:true},{type:'plan',req:false}],outputs:[{type:'branch'},{type:'summary',opt:true}]},
  ];
}
function N(id,taskId,x,y,extra){ return {id,taskId,x,y,name:'',extra:extra||'',off:[]}; }
function E(from,ft,to,tt){ return {id:'e-'+from+'-'+to+'-'+tt, from, ft, to, tt}; }
function seedFlows(){
  return [

  r.artifact=buildArtifact(r);
  r.audit.push({at:t,who:'app',what:'Run succeeded · worktree deleted · Artifact written'+(r.pr&&r.mode==='real'?` to PR #${r.pr.number}`:'')});
}
function buildArtifact(r){
  const t=ticketOf(r);
  const outs = r.attempts.filter(a=>!a.stale&&a.state==='succeeded').flatMap(a=>a.outputs);
  const has = ty => outs.find(o=>o.type===ty);
  const tokens = r.attempts.reduce((s,a)=>s+(a.tokens?a.tokens.in+a.tokens.out:0),0);
  return {
    at: now(), partial: r.state!=='succeeded',
    changed: has('branch') ? t.files.map(f=>({path:f[0],add:f[1],del:f[2]})) : [],
    summary: has('summary') ? has('summary').value : (has('branch') ? `Changed ${t.files.length} files in ${t.area}.` : 'No code was changed.'),
    howTo: howToTest(t),
    shots: has('screenshot') ? has('screenshot').value.split(', ') : [],
    tests: has('test-result') ? has('test-result').value : null,
    plan: has('plan') ? has('plan').value : null,
    tokens, duration: (r.endedAt||now())-(r.startedAt||r.createdAt),
  };
}
function howToTest(t){
  const base=[`git fetch && git switch ${'clauderon/'+t.number+'-'+slug(t.title)}`,'npm ci && npm test'];
  const by={webhooks:['Point a test endpoint at a URL that returns 503','Send a payment.succeeded webhook and watch it retry at 1m, 2m, 4m'],transfers:['POST /transfers twice with the same Idempotency-Key','Expect one transfer and the same response body both times'],fx:['Convert 1,000.00 USD to JPY','Expect a whole-yen amount with no fractional part'],statements:['GET /statements?limit=20','Follow the next cursor until it is empty'],settlement:['Run the suite with TZ=America/New_York','Run it again on 2024-03-31 with a faked clock'],ledger:['GET /accounts/acc_123/balances?from=2026-08-01&to=2026-10-31','Compare the last value with the account balance'],docs:['Open the guide on the docs preview','Run both code samples against the sandbox'],settings:['Open Settings and toggle dark mode','Check contrast of inputs and borders'],transactions:['Sign in as a new account with no data','Expect the empty state and the import link'],search:['Press / on any page','Press Ctrl+K inside a text field: it must not steal focus'],datepicker:['Open the date picker at 360px width','The popover stays inside the screen'],db:['Run the migration suite','Kill the DB connection and check the pool recovers']};
  return base.concat(by[t.area]||['Follow the steps in the issue']);
}

function advance(r,t,dt){
  let a=curAttempt(r);
  if(!a){
    const nid=nextNode(r);
    if(!nid){ finishRun(r,t); return; }
    createAttempt(r,nid,t); return;
  }
  if(a.state!=='running') return;
  a.prog += dt;
  const task=taskOf(r,a.nodeId);
  if(a.phase==='reading'){
    a.shown=Math.min(a.planned.length, 1+Math.floor(a.prog/a.dur*a.planned.length));
    if(a.prog>=a.dur){ a.phase='asking'; a.state='waiting'; a.waitingSince=t; r.state='waiting'; a.planned.push(`[claude] asked question 1 of ${a.grill.q.length}`); a.shown=a.planned.length; }
    return;
  }
  if(a.phase==='writing'){
    if(a.prog>=a.dur){ a.planned.push('[claude] plan written','[claude] done'); completeAttempt(r,a,true,t); }
    return;
  }
  a.shown=Math.min(a.planned.length, 1+Math.floor(a.prog/a.dur*(a.planned.length)));
  if(a.prog>=a.dur){ const fail=shouldFail(r,task,a); completeAttempt(r,a,!fail,t); if(fail) r.audit.push({at:t,who:'app',what:`“${nodeName(r,a.nodeId)}” failed: ${a.failReason}`}); }
}

function tick(dt){
  const t=now(); const sp=S.speed||1; dt*=sp;
  S.pods.forEach(p=>{ if(podUp(p)){ if(!p.j||t-p.j>2500){ p.j=t; const busy=slotsUsed(p.id)/Math.max(1,p.slots); p.cpu=Math.round(Math.max(4,Math.min(98,p.cpu*.6+(15+busy*70+rand(-8,8))*.4))); p.ram=Math.round(Math.max(20,Math.min(95,p.ram*.8+(40+busy*35)*.2))); } } });
  if(S.host.agent&&(!S.host.j||t-S.host.j>2500)){ S.host.j=t; const up=S.pods.filter(podUp); S.host.cpu=Math.round(Math.min(95,8+up.reduce((a,p)=>a+p.cpu*p.cpuLimit/S.host.cores,0))); S.host.ram=Math.round(Math.min(95,18+up.reduce((a,p)=>a+p.ram*p.ramLimit/S.host.memGB,0))); }
  S.pods.forEach(p=>{
    if(!podUp(p)) return;
    let used=slotsUsed(p.id);
    const q=S.runs.filter(r=>r.podId===p.id&&r.state==='queued').sort((a,b)=>a.queuedAt-b.queuedAt);
    while(used<p.slots && q.length){ const r=q.shift(); startRun(r,t); used++; }
  });
  S.runs.forEach(r=>{ if(r.state==='running') advance(r,t,dt); });
  U.dirty=true;
}

/* ---- human & member actions */
function audit(r,what){ r.audit.push({at:now(),who:S.me,what}); }
function actApprove(r){
  const a=curAttempt(r); if(!a||a.state!=='waiting') return;
  a.decision={by:S.me,at:now(),kind:'approved'}; completeAttempt(r,a,true,now()); r.state='running';
  audit(r,`Approved “${nodeName(r,a.nodeId)}”`); toast(`Approved · ${nodeName(r,a.nodeId)}`);
}
function actReject(r,fb){
  const a=curAttempt(r); if(!a||a.state!=='waiting') return;
  a.decision={by:S.me,at:now(),kind:'rejected',feedback:fb}; r.lastFeedback=fb;
  completeAttempt(r,a,false,now(),`Rejected by ${S.me}: “${fb}”`);
  audit(r,`Rejected “${nodeName(r,a.nodeId)}” with feedback: “${fb}”`); toast('Rejected · the Run is now Failed. Retry from an earlier Node to apply the feedback.');
}
function actAnswer(r,text){
  const a=curAttempt(r); if(!a||!a.grill||a.state!=='waiting') return;
  a.grill.answers.push({text,by:S.me,at:now()});
  a.planned.push(`[member] ${S.me} answered question ${a.grill.answers.length}`);
  audit(r,`Answered Grill question ${a.grill.answers.length} in “${nodeName(r,a.nodeId)}”`);
  if(a.grill.answers.length<a.grill.q.length){ a.planned.push(`[claude] (same session) asked question ${a.grill.answers.length+1} of ${a.grill.q.length}`); a.shown=a.planned.length; toast('Answer sent · Claude asked the next question'); }
  else { a.state='running'; a.phase='writing'; a.prog=0; a.dur=r.mode==='dry'?1500:4000; r.state='running'; a.planned.push('[claude] (same session) resuming with your answers'); a.shown=a.planned.length; toast('Answer sent · Claude is writing the plan'); }
}
function actCancel(r){
  const t=now(); const a=curAttempt(r);
  if(a && (a.state==='running'||a.state==='waiting')){ a.state='cancelled'; a.endedAt=t; a.planned.push(`[app] cancelled by ${S.me}`); a.shown=a.planned.length; }
  const wasFrom=r.state;
  r.state='cancelled'; r.endedAt=t; r.curId=null; r.worktree=r.startedAt?'deleted':'none';
  r.artifact=r.startedAt?buildArtifact(r):null;
  audit(r,`Cancelled the Run (was ${RUN_LABEL[wasFrom]})`); toast('Run cancelled'+(r.startedAt?' · worktree deleted':''));
}
function actRetry(r,nid){
  const ds=descendants(r.flow,nid);
  r.attempts.forEach(a=>{ if(ds.has(a.nodeId)) a.stale=true; });
  if(r.lastFeedback) r.feedbackFor={nodeId:nid,text:r.lastFeedback};
  r.state='queued'; r.queuedAt=now(); r.curId=null; r.failReason=null; r.interruptedAt=null; r.lastFeedback=null;
  if([...ds].some(id=>taskOf(r,id).flavor==='pr')) { if(r.pr && r.pr.state!=='open') r.pr=null; }
  audit(r,`Retried from “${nodeName(r,nid)}”${r.feedbackFor?` with feedback “${r.feedbackFor.text}”`:''}`);
  toast(`Retrying from ${nodeName(r,nid)} · queued on ${podById(r.podId).name}`);
}
function actMove(r,podId){ const from=podById(r.podId).name; r.podId=podId; r.queuedAt=now(); audit(r,`Moved the queued Run from ${from} to ${podById(podId).name}`); toast(`Moved to ${podById(podId).name}`); }
function interruptPod(p,why){
  const t=now();
  S.runs.filter(r=>r.podId===p.id&&r.state==='running').forEach(r=>{ const a=curAttempt(r); if(a){ a.state='interrupted'; a.endedAt=t; a.planned.push('[app] ✗ '+why); a.shown=a.planned.length; } r.state='interrupted'; r.interruptedAt=t; r.interruptReason=why; r.curId=null; r.worktree='kept'; r.audit.push({at:t,who:'app',what:`${why}; Run Interrupted`}); });
}

/* ---------------------------------------------------------------- seeding batches */
function seedBatch({flow,pod,mode,who,at,items,failRate}){
  const b={id:uid('b'),flowId:flow,podId:pod,mode,starter:who,createdAt:at,runIds:[]};
  S.batches.push(b);
  items.forEach(([tid,plan],i)=>{
    const r=newRun({ticketId:tid,flowId:flow,podId:pod,batchId:b.id,mode,who,failRate,at:at+i*1000});
    b.runIds.push(r.id);
    ffRun(r,plan,at+i*1000);
  });
}
function ffRun(r,plan,t0){
  if(plan==='queued') return;
  const [kind,stop]=plan.split(':');
  let t=t0+rand(5000,30000);
  startRun(r,t);
  for(let guard=0;guard<40;guard++){
    const nid=nextNode(r);
    if(!nid){ finishRun(r,t); r.endedAt=t; r.audit[r.audit.length-1].at=t; if(r.artifact){ r.artifact.at=t; r.artifact.duration=t-r.startedAt; } return; }
    const task=taskOf(r,nid);
    const d = r.mode==='dry' ? rand(2000,8000) : task.kind==='agent' ? rand(3,9)*MIN : task.kind==='human' ? rand(2,14)*MIN : rand(.6,2.2)*MIN;
    const a=createAttempt(r,nid,t,{dur:d});
    if(task.kind==='entry'){ continue; }
    const isStop = nid===stop;
    if(isStop){
      if(kind==='run'){ a.startedAt=now()-a.dur*.35/ (S.speed||1); a.dur=attemptDur(r,task); a.prog=a.dur*.35; return; }
      if(kind==='wait'){
        if(task.human==='grill'){ a.phase='asking'; a.state='waiting'; a.waitingSince=t+3500; r.state='waiting'; a.planned.push(`[claude] asked question 1 of ${a.grill.q.length}`); a.shown=a.planned.length; }
        else { a.waitingSince=t; }
        return;
      }
      if(kind==='fail'){ completeAttempt(r,a,false,t+d); r.audit.push({at:t+d,who:'app',what:`“${nodeName(r,nid)}” failed: ${a.failReason}`}); return; }
      if(kind==='intr'){ a.prog=a.dur*.6; a.shown=Math.ceil(a.planned.length*.6); a.state='interrupted'; a.endedAt=t+d*.6; a.planned.splice(a.shown,0,'[app] ✗ Pod container exited'); a.shown++; r.state='interrupted'; r.interruptedAt=t+d*.6; r.interruptReason=`${podById(r.podId).name} container exited`; r.worktree='kept'; r.curId=null; r.audit.push({at:t+d*.6,who:'app',what:`${podById(r.podId).name} container exited; Run Interrupted`}); return; }
      if(kind==='cancel'){ a.state='cancelled'; a.endedAt=t+d*.5; a.planned.push(`[app] cancelled by ${r.starter}`); a.shown=a.planned.length; r.state='cancelled'; r.endedAt=t+d*.5; r.curId=null; r.worktree='deleted'; r.artifact=buildArtifact(r); r.artifact.at=r.endedAt; r.audit.push({at:r.endedAt,who:r.starter,what:'Cancelled the Run (was Running)'}); return; }
    }
    if(task.kind==='human'){
      if(task.human==='grill'){ a.grill.q.forEach((q,i)=>a.grill.answers.push({text:['Only the case in the issue','No schema change','Run the focused tests and try it on staging'][i]||'Yes',by:r.starter,at:t+(i+1)*MIN})); a.planned.push(`[member] ${r.starter} answered ${a.grill.q.length} questions`,'[claude] plan written'); }
      else { a.decision={by:pick(['huy','linh','toi','minh']),at:t+d,kind:'approved'}; r.audit.push({at:t+d,who:a.decision.by,what:`Approved “${nodeName(r,nid)}”`}); }
    }
    completeAttempt(r,a,true,t+d);
    t+=d+rand(2000,9000);
  }
}
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }

/* ---------------------------------------------------------------- derived */
function ticketStatus(t){
  if(t.issueState==='closed') return 'closed';
  const runs=S.runs.filter(r=>r.ticketId===t.id&&r.mode==='real').sort((a,b)=>b.createdAt-a.createdAt);
  const act=runs.find(isActive);
  if(act) return {queued:'queued',running:'in-run',waiting:'needs-you',failed:'failed',interrupted:'interrupted'}[act.state];
  const pr=runs.find(r=>r.pr&&r.pr.state!=='simulated');
  if(pr) return pr.pr.state==='merged'?'pr-merged':'pr-open';
  return 'open';
}
function activeRunOf(t){ return S.runs.find(r=>r.ticketId===t.id&&r.mode==='real'&&isActive(r)); }
function latestRun(t){ return S.runs.filter(r=>r.ticketId===t.id).sort((a,b)=>b.createdAt-a.createdAt)[0]; }
function activeRunsUsing(flowId){ return S.runs.filter(r=>r.flowId===flowId&&isActive(r)); }
function waitingItems(){ return S.runs.filter(r=>r.state==='waiting').map(r=>({r,a:curAttempt(r)})).filter(x=>x.a).sort((x,y)=>(x.a.waitingSince||0)-(y.a.waitingSince||0)); }
function runCurrentLabel(r){
  if(r.state==='queued') return {txt: r.attempts.length?'Waiting for a Slot (retry)':'Waiting for a Slot', cls:''};
  const a = curAttempt(r) || r.attempts.filter(x=>!x.stale&&x.nodeId!==r.flow.nodes[0].id).slice(-1)[0] || r.attempts.slice(-1)[0];
  if(!a) return {txt:'—',cls:''};
  return {txt:nodeName(r,a.nodeId),cls:''};
}
function runDuration(r){ if(!r.startedAt) return null; return (r.endedAt||now())-r.startedAt; }
function runTokens(r){ return r.attempts.reduce((s,a)=>s+(a.tokens?a.tokens.in+a.tokens.out:0),0); }
function queuePos(r){ const q=S.runs.filter(x=>x.podId===r.podId&&x.state==='queued').sort((a,b)=>a.queuedAt-b.queuedAt); return q.indexOf(r)+1; }

/* ---------------------------------------------------------------- flow validation */
function nodeTask(n){ return taskById(n.taskId); }
function validate(f){
  const P=[]; const nodes=f.nodes;
  const entries=nodes.filter(n=>nodeTask(n)&&nodeTask(n).kind==='entry');
  if(entries.length!==1) P.push({msg: entries.length===0?'Add the Ticket Node: every Flow starts from exactly one Ticket.':'A Flow has exactly one Ticket Node; remove the extra one.', node: entries[1]&&entries[1].id});
  if(nodes.length<2) P.push({msg:'Add at least one Node after the Ticket.'});
  // edge type checks
  f.edges.forEach(e=>{ if(e.ft!==e.tt) P.push({msg:`${e.ft} → ${e.tt}: Output Type does not match the input.`, edge:e.id}); });
  f.edges.forEach(e=>{ const n=nodes.find(x=>x.id===e.from); if(n&&(n.off||[]).includes(e.ft)) P.push({msg:`“${dispName(n)}” has its ${e.ft} Output turned off but an edge uses it.`, edge:e.id}); });
  // cycles
  const order=topo(f); if(order.length<nodes.length){ const inCycle=nodes.filter(n=>!order.includes(n.id)).map(n=>n.id); P.push({msg:`The Flow has a cycle through ${inCycle.map(id=>'“'+dispName(nodes.find(n=>n.id===id))+'”').join(', ')}. Flows cannot loop; use Retry instead.`, cycle:inCycle}); }
  // required inputs
  nodes.forEach(n=>{ const t=nodeTask(n); if(!t) return; t.inputs.forEach(i=>{ const es=f.edges.filter(e=>e.to===n.id&&e.tt===i.type); if(i.req && !es.some(e=>e.ft===e.tt)) P.push({msg:`“${dispName(n)}” needs a ${i.type} input.`, node:n.id}); if(es.length>1) P.push({msg:`“${dispName(n)}” takes one ${i.type}; ${es.length} are connected.`, node:n.id}); }); });
  return P;
}
function dispName(n){ return n.name || (nodeTask(n)?nodeTask(n).name:'Node'); }
function flowProblems(f){ return validate(f); }

/* ---------------------------------------------------------------- views */
function renderView(force){
  const v=document.getElementById('view'); if(!v) return;
  const r=route();
  if(!force){
    if(r.v==='flow') return;                       // editor manages itself
    const ae=document.activeElement;
    if(ae && v.contains(ae) && /INPUT|TEXTAREA|SELECT/.test(ae.tagName)) return;
    if(U.modal) { /* still refresh background */ }
  }
  // keep scroll of terminals
  const scrolls={}; v.querySelectorAll('[data-scroll]').forEach(el=>{ scrolls[el.dataset.scroll]={top:el.scrollTop,atEnd:el.scrollTop+el.clientHeight>=el.scrollHeight-8}; });
  let html='';
  switch(r.v){
    case 'tickets': html=ticketsView(); break;
    case 'ticket': html=ticketView(r.id); break;
    case 'runs': html=runsView(); break;
    case 'run': html=runView(r.id); break;
    case 'batch': html=batchView(r.id); break;
    case 'needs-you': html=needsView(); break;
    case 'flows': html=flowsView(); break;
    case 'flow': html=flowEditorView(r.id); break;
    case 'pods': html=podsView(); break;
    case 'pod': html=podView(r.id); break;
    case 'projects': html=projectsView(); break;
    default: html=ticketsView();
  }
  v.innerHTML=html;
  v.querySelectorAll('[data-scroll]').forEach(el=>{ const s=scrolls[el.dataset.scroll]; if(!s||s.atEnd) el.scrollTop=el.scrollHeight; else el.scrollTop=s.top; });
  if(r.v==='flow') mountEditor();
}

function startSubmit(){
  const m=U.modal; const f=flowById(m.flowId); const pod=podOf(S.me);

  const t=now(); const b={id:uid('b'),flowId:f.id,podId:pod.id,mode:m.mode,starter:S.me,createdAt:t,runIds:[]};
  S.batches.push(b);
  ids.forEach((id,i)=>{ const r=newRun({ticketId:id,flowId:f.id,podId:pod.id,batchId:b.id,mode:m.mode,who:S.me,extra:m.extra,failRate:m.failRate,at:t+i}); b.runIds.push(r.id); });

  location.hash='batch-'+b.id;
}

function runView(id){

  const tab=U.runTab[r.id]||'node';

  const actions = [

function miniGraph(r){
  const f=r.flow; const xs=f.nodes.map(n=>n.x), ys=f.nodes.map(n=>n.y);
  const minx=Math.min(...xs)-10, miny=Math.min(...ys)-10, W=Math.max(...xs)+218-minx, H=Math.max(...ys)+80-miny;
  const sc=.74; const nh=48;
  const st=nid=>nodeState(r,nid);
  const col={succeeded:'--ok',failed:'--fail',running:'--run',waiting:'--wait',interrupted:'--intr',cancelled:'--mute',pending:'--line-strong'};
  const edges=f.edges.map(e=>{ const a=f.nodes.find(n=>n.id===e.from), b=f.nodes.find(n=>n.id===e.to); if(!a||!b) return ''; const x1=a.x+208,y1=a.y+nh/2,x2=b.x,y2=b.y+nh/2,dx=Math.max(30,(x2-x1)/2); return `<path d="M${x1} ${y1} C${x1+dx} ${y1},${x2-dx} ${y2},${x2} ${y2}" fill="none" stroke="var(--line-strong)" stroke-width="2"/>`; }).join('');
  const nodes=f.nodes.map(n=>{ const s=n.taskId==='t-ticket'?'succeeded':st(n.id); const c=col[s]||'--line-strong'; const nm=n.taskId==='t-ticket'?tkKey(ticketOf(r)):nodeName(r,n.id); return `<g data-act="sel-node" data-run="${r.id}" data-node="${n.id}" style="cursor:pointer"><rect x="${n.x}" y="${n.y}" width="208" height="${nh}" rx="9" fill="var(--panel)" stroke="var(${c})" stroke-width="${s==='pending'?1.5:2.5}"/><rect x="${n.x}" y="${n.y}" width="6" height="${nh}" rx="3" fill="var(${c})"/><text x="${n.x+18}" y="${n.y+21}" fill="var(--fg)">${esc(nm.length>26?nm.slice(0,25)+'…':nm)}</text><text x="${n.x+18}" y="${n.y+38}" fill="var(--fg3)" style="font-weight:500;font-size:11px">${s==='pending'?'pending':s==='waiting'?'waiting for human':s}</text></g>`; }).join('');
  return `<svg width="${Math.round(W*sc)}" height="${Math.round(H*sc)}" viewBox="${minx} ${miny} ${W} ${H}" role="img" aria-label="Flow graph with Node states">${edges}${nodes}</svg>`;
}
function diffLines(path,add,del,t){
  const h=hash(path+t.id); const ext=path.split('.').pop(); const lines=[];
  const fn=slug(t.title).split('-').map((w,i)=>i?w[0].toUpperCase()+w.slice(1):w).join('').slice(0,28);
  const ctx = ext==='md' ? [`## ${t.title}`,''] : ext==='sql' ? ['-- migration'] : ext==='json' ? ['{','  "dependencies": {'] : ext==='css' ? [`.${t.area} {`] : [`import { config } from '../config';`,''];
  const dels = ext==='md'?[]: ext==='json'?['    "pg": "^8.7.3",']: ext==='css'?['  background: #fff;','  color: #111;']:[`export function ${fn}(input) {`,`  return legacy(input);`];
  const adds = ext==='md'?['Verify every webhook with the shared secret before trusting it.','','```js',`const ok = verify(req.headers['x-ledger-signature'], body, secret);`,'```']
    : ext==='sql'?[`CREATE TABLE idempotency_keys (`,`  key text PRIMARY KEY,`,`  response jsonb NOT NULL,`,`  created_at timestamptz DEFAULT now()`,`);`]
    : ext==='json'?['    "pg": "^8.12.0",']
    : ext==='css'?['  background: var(--surface);','  color: var(--text);','  border-color: var(--border);']
    : /test/.test(path)?[`describe('${t.area}', () => {`,`  it('handles ${t.title.toLowerCase().slice(0,40)}', async () => {`,`    const res = await ${fn}(fixture());`,`    expect(res.ok).toBe(true);`,`  });`,`});`]
    : [`export async function ${fn}(input: Input): Promise<Result> {`,`  const opts = { ...defaults, ...config.${t.area} };`,`  const result = await run(input, opts);`,`  log.info({ area: '${t.area}', id: input.id }, 'done');`,`  return result;`,`}`];
  lines.push({c:'hk',t:`@@ -${10+h%40},${dels.length+ctx.length} +${10+h%40},${adds.length+ctx.length} @@`});
  ctx.forEach(l=>lines.push({c:'',t:' '+l}));
  (del?dels:[]).forEach(l=>lines.push({c:'de',t:'-'+l}));
  adds.forEach(l=>lines.push({c:'ad',t:'+'+l}));
  return lines;
}

          if(d.edges.some(x=>x.from===nid&&x.to===to&&x.ft===type&&x.tt===tt)) return;

          if(type!==tt) toast(`${type} cannot feed a ${tt} input. The edge is marked as a problem.`);
          U.ed.sel=null; edChanged(); }
      };
      window.addEventListener('pointermove',mv); window.addEventListener('pointerup',up); return;
    }
    if(drag){
      const nid=drag.dataset.drag; U.ed.sel={node:nid};
      if(ro){ renderCanvas(); renderInspector(); return; }
      e.preventDefault();
      const n=d.nodes.find(x=>x.id===nid); const sx=e.clientX, sy=e.clientY, ox=n.x, oy=n.y; let moved=false;
      const el=cv.querySelector(`.gnode[data-node="${nid}"]`); document.querySelectorAll('.gnode.sel').forEach(x=>x.classList.remove('sel')); el&&el.classList.add('sel');
      const mv=ev=>{ moved=true; n.x=Math.max(0,Math.min(1500-NW,Math.round((ox+ev.clientX-sx)/10)*10)); n.y=Math.max(0,Math.min(780,Math.round((oy+ev.clientY-sy)/10)*10)); renderCanvas(); };
      const up=()=>{ window.removeEventListener('pointermove',mv); window.removeEventListener('pointerup',up); if(moved) U.ed.dirty=true; renderEditorKeepScroll(); };
      window.addEventListener('pointermove',mv); window.addEventListener('pointerup',up); return;
    }
    if(edge){ U.ed.sel={edge:edge.dataset.edge}; renderCanvas(); renderInspector(); return; }
    if(nodeEl){ U.ed.sel={node:nodeEl.dataset.node}; renderCanvas(); renderInspector(); return; }
    U.ed.sel=null; renderCanvas(); renderInspector();
  });
  document.addEventListener('dragstart',e=>{ const p=e.target.closest&&e.target.closest('.pal-task'); if(p&&e.dataTransfer){ e.dataTransfer.setData('text/plain',p.dataset.task); e.dataTransfer.effectAllowed='copy'; } });
  document.addEventListener('dragover',e=>{ if(e.target.closest&&e.target.closest('#cv-wrap')) e.preventDefault(); });
  document.addEventListener('drop',e=>{ const w=e.target.closest&&e.target.closest('#cv-wrap'); if(!w||!U.ed||edReadOnly()) return; e.preventDefault(); const id=e.dataTransfer.getData('text/plain'); const r=document.getElementById('cv').getBoundingClientRect(); addNode(id,e.clientX-r.left-NW/2,e.clientY-r.top-20); });
}

  if(cmd==='claude --version'){ out('2.1.4 (Claude Code)'); return; }
  if(cmd==='claude login'){ if(p.claude.ok){ out(`✓ Already logged in as ${p.claude.acct}`); return; } const code=Math.random().toString(36).slice(2,6).toUpperCase()+'-'+Math.random().toString(36).slice(2,6).toUpperCase(); out('Opening a browser is not possible in a container.',`! Visit https://claude.ai/oauth/device and enter code ${code}`,'  waiting for you to approve…'); later(2500,()=>{ p.claude={ok:true,acct:p.owner+'@agility.io'}; T.push(`✓ Logged in as ${p.claude.acct} (Max plan). Credentials saved to ~/.claude`); p.audit.push({at:now(),who:S.me,what:'Logged in to Claude Code'}); toast('Claude Code logged in'); }); return; }
  if(cmd==='claude logout'){ p.claude={ok:false,acct:null}; out('✓ Logged out'); p.audit.push({at:now(),who:S.me,what:'Logged out of Claude Code'}); return; }
  if(cmd==='gh auth login'){ if(p.gh.ok){ out(`✓ Already logged in to github.com as ${p.gh.user}`); return; } const code=Math.random().toString(36).slice(2,6).toUpperCase()+'-'+Math.random().toString(36).slice(2,6).toUpperCase(); out('? Where do you use GitHub? GitHub.com','? Authenticate with a token or the browser? Login with a web browser',`! First copy your one-time code: ${code}`,'  Open https://github.com/login/device and paste it'); later(2500,()=>{ p.gh={ok:true,user:p.owner+'-agility',scope:S.projects.map(x=>x.repo).join(', ')}; T.push(`✓ Logged in to github.com account ${p.gh.user} (keyring)`); p.audit.push({at:now(),who:S.me,what:'Logged in to gh as '+p.gh.user}); toast('gh logged in'); }); return; }
  if(cmd==='gh auth logout'){ p.gh={ok:false,user:null}; out('✓ Logged out of github.com'); p.audit.push({at:now(),who:S.me,what:'Logged out of gh'}); return; }
  if(cmd==='gh auth status'){ if(p.gh.ok) out('github.com',`  ✓ Logged in to github.com account ${p.gh.user} (keyring)`,`  - Token scopes: repo access limited to ${p.gh.scope||'selected repositories'}`); else out('✗ You are not logged into any GitHub hosts. To log in, run: gh auth login'); return; }
  if(/^ls/.test(cmd)){ const clones=[...new Set(S.projects.map(x=>x.repo.split('/')[1]))]; out(clones.concat(['runs/']).join('   ')); return; }
  if(/^git -C/.test(cmd)){ out('On branch main','Your branch is up to date with \'origin/main\'.','nothing to commit, working tree clean'); return; }
  out(`bash: ${cmd.split(' ')[0]}: not available in this simulated shell (try help)`);
}
function podAction(p,kind){
  const t=now(); const busy=S.runs.some(r=>r.podId===p.id&&holdsSlot(r));
  if((kind==='stop'||kind==='recreate')&&busy){ toast('Refused: Runs are running or waiting on this Pod.'); return; }
  const done=(ms,fn)=>setTimeout(()=>{ fn(); rerender(); },ms/(S.speed||1));
  if(kind==='start'){ p.state='starting'; p.audit.push({at:t,who:S.me,what:'Started the Pod'}); done(2000,()=>{ p.state='running'; p.cpu=10; p.ram=25; toast(`${p.name} is running`); }); }
  if(kind==='stop'){ p.state='stopped'; p.audit.push({at:t,who:S.me,what:'Stopped the Pod'}); toast(`${p.name} stopped · new Runs will queue`); }
  if(kind==='recreate'){ p.state='recreating'; p.audit.push({at:t,who:S.me,what:`Recreated the Pod with ${S.host.latestImage}`}); done(3500,()=>{ p.image=S.host.latestImage; p.state='running'; toast(`${p.name} recreated · Workspace and logins kept`); }); }
  rerender();
}

/* ---------------------------------------------------------------- events */
function rerender(){ renderSide(); renderView(true); }
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act, id=el.dataset.id;
  if(act==='modal-bg'){ if(e.target===el){ U.modal=null; renderModal(); } return; }
  if(['tk-sel','tk-all','ed-off','tm-req','tm-opt','ids','sd-flow','sd-pod','rt-node'].includes(act)) return; // handled on change
  if(el.tagName==='SELECT') return;
  switch(act){
    case 'si-google': U.gpick=true; U.denied=null; renderApp(); break;
    case 'si-back': U.gpick=false; U.denied=null; renderApp(); break;
    case 'si-google-pick': { const e=el.dataset.v; U.gpick=false; if(!ALLOW.includes(e)){ U.denied=e; renderApp(); break; } S.me=e.split('@')[0]; S.meEmail=e; S.meName=el.dataset.n; save(); renderApp(); toast(`Signed in as ${e}`); break; }
    case 'switch-user': S.me=null; S.meEmail=null; S.meName=null; U.gpick=false; U.denied=null; save(); toast('Signed out'); document.getElementById('app').innerHTML=''; renderApp(); break;
    case 'theme': setPref('theme',el.dataset.v); applyTheme(); renderSide(); break;
    case 'sim': U.sim=!U.sim; renderSim(); break;
    case 'speed': S.speed=+el.dataset.v; renderSim(); break;
    case 'reset-open': U.modal={type:'reset'}; renderModal(); break;
    case 'reset-confirm': { const me=S.me; seed(); S.me=me; U.modal=null; U.ed=null; U.sel.clear(); save(); renderModal(); renderSim(); rerender(); toast('Demo data reset'); break; }
    case 'modal-close': U.modal=null; renderModal(); break;
    case 'copy': { const t=document.getElementById(el.dataset.target); const txt=t?t.textContent:''; try{ navigator.clipboard.writeText(txt).then(()=>toast('Copied'),()=>{ selectText(t); toast('Press Ctrl+C to copy'); }); }catch(err){ selectText(t); } break; }
    // tickets
    case 'tk-project': U.tkProject=id; rerender(); break;
    case 'tk-filter': U.tkFilter=el.dataset.v; rerender(); break;
    case 'tk-clear': U.sel.clear(); rerender(); break;

    case 'sel-att': U.attSel[el.dataset.key]=id; rerender(); break;

    case 'retry-open': U.modal={type:'retry',runId:id}; renderModal(); break;

    // pods

    case 'flow-clone': { const f=flowById(id); const nf=clone(f); nf.id=uid('f'); nf.name='Copy of '+f.name; nf.sample=false; nf.clonedFrom=f.id; S.flows.push(nf); U.ed=null; toast(`Cloned to “${nf.name}”`); location.hash='flow-'+nf.id; break; }
    case 'flow-new': { const nf={id:uid('f'),name:'Untitled Flow',sample:false,description:'',nodes:[N('n1','t-ticket',40,80)],edges:[]}; S.flows.push(nf); U.ed=null; location.hash='flow-'+nf.id; break; }
    case 'ed-add': { if(edReadOnly()) break; const w=document.getElementById('cv-wrap'); const x=(w?w.scrollLeft:0)+60+Math.random()*200, y=(w?w.scrollTop:0)+60+Math.random()*160; addNode(id,x,y); break; }
    case 'ed-del': { const d=U.ed.d; const s=U.ed.sel||{}; if(s.node){ const n=d.nodes.find(x=>x.id===s.node); if(n&&n.taskId==='t-ticket'&&d.nodes.filter(x=>x.taskId==='t-ticket').length===1){ /* allow, validator will complain */ } d.nodes=d.nodes.filter(x=>x.id!==s.node); d.edges=d.edges.filter(x=>x.from!==s.node&&x.to!==s.node); } if(s.edge) d.edges=d.edges.filter(x=>x.id!==s.edge); U.ed.sel=null; edChanged(); renderEditorKeepScroll(); break; }
    case 'ed-prob': { const p=validate(U.ed.d)[+el.dataset.i]; if(!p) break; U.ed.sel=p.edge?{edge:p.edge}:p.node?{node:p.node}:p.cycle?{node:p.cycle[0]}:null; renderCanvas(); renderInspector(); break; }
    case 'flow-save': { readEditorFields(); const f=flowById(U.ed.flowId); if(edReadOnly()) break; f.name=U.ed.d.name.trim()||'Untitled Flow'; f.description=U.ed.d.description; f.nodes=clone(U.ed.d.nodes); f.edges=clone(U.ed.d.edges); U.ed.dirty=false; const pr=validate(f); toast(pr.length?`Saved with ${pr.length} problem${pr.length>1?'s':''} · it cannot start Runs yet`:'Saved · this Flow can start Runs'); renderEditorKeepScroll(); break; }
    case 'flow-discard': U.ed=null; renderView(true); break;
    case 'flow-del': { const f=flowById(U.ed.flowId); if(edReadOnly()) break; S.flows=S.flows.filter(x=>x.id!==f.id); U.ed=null; toast(`Deleted “${f.name}”`); location.hash='flows'; break; }
    // tasks
    case 'task-clone': { const t=taskById(id); const nt=clone(t); nt.id=uid('t'); nt.name=t.name+' (team)'; nt.sample=false; nt.clonedFrom=t.id; U.modal={type:'task',task:nt,isNew:true}; renderModal(); break; }
    case 'task-new': U.modal={type:'task',isNew:true,task:{id:uid('t'),name:'New Task',kind:'agent',flavor:'generic',sample:false,instructions:'',inputs:[{type:'issue',req:true}],outputs:[{type:'summary'}]}}; renderModal(); break;
    case 'task-edit': { const t=taskById(id); const inUse=S.flows.some(f=>f.nodes.some(n=>n.taskId===id)&&activeRunsUsing(f.id).length); U.modal={type:'task',task:clone(t),inUse}; renderModal(); break; }
    case 'tm-kind': { readTaskFields(); const [k,h]=el.dataset.v.split(':'); const t=U.modal.task; t.kind=k; t.human=h||undefined; if(k==='command'&&!t.command) t.command='npm run lint'; t.flavor=k==='human'?(h==='grill'?'grill':'approve'):(t.clonedFrom?t.flavor:'generic'); renderModal(); break; }
    case 'tm-add': { readTaskFields(); U.modal.task[el.dataset.k].push(el.dataset.k==='inputs'?{type:'branch',req:true}:{type:'summary'}); renderModal(); break; }
    case 'tm-rm': { readTaskFields(); U.modal.task[el.dataset.k].splice(+el.dataset.i,1); renderModal(); break; }
    case 'tm-save': { readTaskFields(); const t=U.modal.task; if(!t.name.trim()){ toast('Give the Task a name.'); break; } const ex=taskById(t.id); if(ex) Object.assign(ex,t); else S.tasks.push(t); U.modal=null; renderModal(); toast(`Saved Task “${t.name}”`); rerender(); break; }
  }
});
function selectText(el){ if(!el) return; const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }
function syncStartFields(){ const m=U.modal; if(!m||m.type!=='start') return; const x=document.getElementById('sd-extra'); if(x) m.extra=x.value; const fr=document.getElementById('sd-fail'); if(fr) m.failRate=+fr.value/100; }
function readEditorFields(){ if(!U.ed) return; const n=document.getElementById('ed-name'); if(n) U.ed.d.name=n.value; const ds=document.getElementById('ed-desc'); if(ds) U.ed.d.description=ds.value; }
function doSync(pid){
  const p=projectById(pid); p.lastSync=now();
  const fresh=S.syncPool.filter(a=>a[0]===pid).slice(0,1);
  fresh.forEach(a=>{ S.tickets.push(mkTicket(a,now()-rand(5,40)*MIN)); S.syncPool=S.syncPool.filter(x=>x!==a); });
  toast(fresh.length?`Synced ${repoShort(p)} · 1 new issue (#${fresh[0][1]})`:`Synced ${repoShort(p)} · no new issues`);
  rerender();
}
document.addEventListener('change',e=>{
  const el=e.target; const act=el.dataset&&el.dataset.act;
  if(act==='tk-sel'){ el.checked?U.sel.add(el.dataset.id):U.sel.delete(el.dataset.id); rerender(); return; }
  if(act==='tk-all'){ const p=U.tkProject; const q=U.tkSearch.trim().toLowerCase(); S.tickets.filter(t=>t.projectId===p&&(U.tkFilter==='all'||ticketStatus(t)===U.tkFilter)&&(!q||t.title.toLowerCase().includes(q)||tkKey(t).toLowerCase().includes(q))).forEach(t=>el.checked?U.sel.add(t.id):U.sel.delete(t.id)); rerender(); return; }
  if(act==='run-filter'){ U.runFilter[el.dataset.k]=el.value; rerender(); return; }
  if(act==='move-run'){ if(el.value){ actMove(runById(el.dataset.id),el.value); rerender(); } return; }
  if(act==='sd-flow'){ syncStartFields(); U.modal.flowId=el.dataset.id; renderModal(); return; }
  if(act==='sd-pod'){ syncStartFields(); U.modal.podId=el.dataset.id; renderModal(); return; }
  if(act==='rt-node'){ U.modal.node=el.dataset.id; renderModal(); return; }
  if(act==='ed-off'){ const n=U.ed.d.nodes.find(x=>x.id===U.ed.sel.node); n.off=n.off||[]; if(el.checked) n.off=n.off.filter(t=>t!==el.dataset.type); else n.off.push(el.dataset.type); edChanged(); return; }
  if(act==='tm-req'){ U.modal.task.inputs[+el.dataset.i].req=el.checked; return; }
  if(act==='tm-opt'){ U.modal.task.outputs[+el.dataset.i].opt=el.checked; return; }
  if(act==='tm-type'){ readTaskFields(); U.modal.task[el.dataset.k][+el.dataset.i].type=el.value; renderModal(); return; }
  if(act==='ids'){ setPref('ids',el.checked); document.documentElement.classList.toggle('hide-ids',!el.checked); return; }
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.draft){ U.drafts[el.dataset.draft]=el.value; return; }
  if(el.id==='tk-search'){ U.tkSearch=el.value; const pos=el.selectionStart; renderView(true); const n=document.getElementById('tk-search'); if(n){ n.focus(); n.setSelectionRange(pos,pos); } return; }
  if(el.id==='sd-fail'){ U.modal.failRate=+el.value/100; const lab=el.previousElementSibling; if(lab) lab.innerHTML=`Failure rate: <span class="num">${el.value}%</span>`; return; }
  if(U.ed && ['ed-name','ed-desc','ed-nname','ed-nextra'].includes(el.id)){
    if(el.id==='ed-name') U.ed.d.name=el.value;
    if(el.id==='ed-desc') U.ed.d.description=el.value;
    const n=U.ed.sel&&U.ed.sel.node&&U.ed.d.nodes.find(x=>x.id===U.ed.sel.node);
    if(n&&el.id==='ed-nname') n.name=el.value;
    if(n&&el.id==='ed-nextra') n.extra=el.value;
    if(!U.ed.dirty){ U.ed.dirty=true; const s=document.querySelector('[data-act="flow-save"]'), dsc=document.querySelector('[data-act="flow-discard"]'); s&&(s.disabled=false); dsc&&(dsc.disabled=false); }
    if(el.id==='ed-nname') renderCanvas();
  }
});
document.addEventListener('submit',e=>{
  e.preventDefault(); const f=e.target;
  if(f.id==='create-form'){ if(podOf(S.me)) return; const t=now(); const p={id:'pod-'+S.me,name:'pod-'+S.me,owner:S.me,state:'creating',slots:Math.max(1,Math.min(6,parseInt(document.getElementById('cp-slots').value,10)||2)),cpuLimit:+document.getElementById('cp-cpu').value,ramLimit:+document.getElementById('cp-ram').value,image:S.host.latestImage,claude:{ok:false,acct:null},gh:{ok:false,user:null},cpu:0,ram:0,wsGB:.4,createdAt:t,audit:[{at:t,who:S.me,what:'Created the Pod'}]}; S.pods.push(p); U.modal=null; renderModal(); toast(`Creating ${p.name}…`); location.hash='pod-'+p.id; setTimeout(()=>{ p.state='running'; p.cpu=6; p.ram=18; toast(`${p.name} is running · log in to Claude Code and gh`); rerender(); },3000/(S.speed||1)); return; }
  if(f.id==='term-form'){ const i=document.getElementById('term-in'); const p=podById(U.modal.podId); termRun(p,i.value); renderModal(); return; }
  if(f.id==='token-form'){ const v=document.getElementById('tk-new').value; S.ghToken='••••'+(v.slice(-4)||'xxxx'); U.modal=null; renderModal(); toast('Token replaced · stored encrypted'); rerender(); return; }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(U.modal){ U.modal=null; renderModal(); } else if(U.sim){ U.sim=false; renderSim(); } } });
window.addEventListener('hashchange',()=>{ if(route().v!=='flow') U.ed=U.ed&&U.ed.dirty?U.ed:null; renderSide(); renderView(true); window.scrollTo(0,0); });

function applyTheme(){ const t=prefs().theme; if(t==='light'||t==='dark') document.documentElement.setAttribute('data-theme',t); else document.documentElement.removeAttribute('data-theme'); }

/* ---------------------------------------------------------------- boot */
function start(){
  S=load(); if(!S){ seed(); }
  if(prefs().ids===undefined) setPref('ids',true);
  applyTheme(); renderApp(); bindEditor();
  let last=now(), lastSave=now();
  document.addEventListener('pointerdown',()=>{ U.pdown=true; },true);
  window.addEventListener('pointerup',()=>{ setTimeout(()=>{ U.pdown=false; },60); },true);
  window.addEventListener('pointercancel',()=>{ U.pdown=false; },true);
  setInterval(()=>{ const t=now(); tick(t-last); last=t; if(S.me&&U.dirty&&!U.pdown){ U.dirty=false; renderSide(); renderView(false); } if(t-lastSave>3000){ lastSave=t; save(); } },400);
}
start();
})();
</script>
