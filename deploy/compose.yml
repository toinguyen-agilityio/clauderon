# The self-hosted Clauderon stack (ADR 0005, ADR 0006).
# Run from the repo root:
#   docker compose -f deploy/compose.yml --env-file deploy/.env.production up -d --build
# A Cloudflare Tunnel publishes web and Gateway to the internet with HTTPS
# (see deploy/README.md); it connects out, so no port is opened on the host.
# Web and Gateway also listen on localhost for checks. Postgres is never published.
# Not "clauderon": that is the dev compose project (the repo folder name), and
# sharing it would let one stack replace or remove the other's containers.
name: clauderon-prod

x-app-env: &app-env
  DATABASE_URL: postgres://clauderon:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/clauderon
  SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
  OPERATOR_EMAILS: ${OPERATOR_EMAILS:?set OPERATOR_EMAILS}

x-public-url: &public-url https://${WEB_HOSTNAME:?set WEB_HOSTNAME}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: clauderon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: clauderon
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clauderon -d clauderon"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Deploy order (spec M4 §5.1): migrations first, then the Gateway, then the web app.
  migrate:
    build: { context: .., dockerfile: deploy/Dockerfile, target: gateway }
    image: clauderon-gateway
    command: ["pnpm", "db:migrate"]
    environment:
      DATABASE_URL: postgres://clauderon:${POSTGRES_PASSWORD}@postgres:5432/clauderon
    depends_on:
      postgres: { condition: service_healthy }

  gateway:
    image: clauderon-gateway
    restart: unless-stopped
    environment:
      <<: *app-env
      GATEWAY_PORT: "4000"
      # Agents that pair open <WEB_URL>/pair?code=… to approve.
      WEB_URL: *public-url
    ports:
      - "127.0.0.1:${GATEWAY_HOST_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build: { context: .., dockerfile: deploy/Dockerfile, target: web }
    image: clauderon-web
    restart: unless-stopped
    environment:
      <<: *app-env
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?set GOOGLE_CLIENT_SECRET}
      AUTH_URL: *public-url
      # The Gateway's public WebSocket origin, for browsers and Agents.
      GATEWAY_URL: wss://${GATEWAY_HOSTNAME:?set GATEWAY_HOSTNAME}
      # Release tag shown in the sidebar; deploy/deploy.sh sets it from git.
      APP_VERSION: ${APP_VERSION:-dev}
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      gateway: { condition: service_healthy }

  # Publishes web and Gateway through the Cloudflare Tunnel whose token is in
  # the env file (deploy/deploy.sh tunnel creates it and the DNS records).
  cloudflared:
    image: cloudflare/cloudflared:2026.2.0
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--config", "/etc/cloudflared/config.yml", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN}
    configs:
      - source: cloudflared
        target: /etc/cloudflared/config.yml
    depends_on:
      web: { condition: service_started }

configs:
  cloudflared:
    # Ingress for a locally managed tunnel; the token only identifies it.
    content: |
      ingress:
        - hostname: ${WEB_HOSTNAME}
          service: http://web:3000
        - hostname: ${GATEWAY_HOSTNAME}
          service: http://gateway:4000
        - service: http_status:404

volumes:
  pgdata:
    # Fixed name, so the data survives a change of project name.
    name: clauderon_pgdata
