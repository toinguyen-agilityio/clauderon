name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clauderon
          POSTGRES_PASSWORD: clauderon
          POSTGRES_DB: clauderon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clauderon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://clauderon:clauderon@localhost:5432/clauderon
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # ADR 0007: the Agent runs on every Member's own computer, so its install
  # and its tests run on macOS, Linux and Windows: the one-line installer
  # (its own Node from nodejs.org, the bundle), bash or Git Bash, and the doctor.
  agent:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @clauderon/host-agent test
      - run: pnpm --filter @clauderon/host-agent build
      - run: pnpm --filter @clauderon/web exec tsx scripts/agent-smoke.ts
