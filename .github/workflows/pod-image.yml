name: Pod image

# Builds the standard Pod image for arm64 and amd64 to prove the Dockerfile
# works. It does not push anywhere yet: the registry is not chosen.
on:
  pull_request:
    paths: ['images/pod/**', '.github/workflows/pod-image.yml']
  push:
    branches: [main, staging]
    paths: ['images/pod/**', '.github/workflows/pod-image.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: images/pod
          platforms: linux/amd64,linux/arm64
          push: false
