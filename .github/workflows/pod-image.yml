name: Pod image

# Builds the standard Pod image for arm64 and amd64 and pushes it to GHCR
# with a date tag on every merge that touches images/pod (POD-14).
on:
  push:
    branches: [main]
    paths: ["images/pod/**", ".github/workflows/pod-image.yml"]
  pull_request:
    paths: ["images/pod/**", ".github/workflows/pod-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Image name and tags
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/clauderon-pod"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tags=$image:$(date -u +%F),$image:$(date -u +%F)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: images/pod
          platforms: linux/arm64,linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
